# GitHub Pages Configuration for REAG Fraud Investigation Toolkit

title: "REAG Fraud Investigation Toolkit"
description: "Open-source toolkit for detecting financial fraud in Brazilian investment funds using statistical analysis and pattern recognition"
baseurl: "/REAG"
url: "https://pedrodnt.github.io"

# Theme
theme: null  # Using custom HTML/CSS

# Build settings
markdown: kramdown
permalink: pretty

# Exclude from processing
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor

# Collections
collections:
  methodologies:
    output: true
    permalink: /methodologies/:name/

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
      lang: pt-BR

# SEO
author: "REAG Investigation Team"
keywords: "fraud detection, investment funds, benford's law, statistical analysis, CVM, Brazilian funds"

# Social
github_username: PedroDnT
repository: PedroDnT/REAG

# Analytics (optional - add your tracking ID)
# google_analytics: UA-XXXXXXXXX-X
