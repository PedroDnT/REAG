name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  public-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate public report
        run: |
          python scripts/generate_public_report.py --format html --output reports/public_report.html

      - name: Upload public report artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-report-html
          path: reports/public_report.html
